<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Student Attendance Tracker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <h1>Student Attendance Tracker</h1>
  <label class="field inline">Attendance date
    <input type="date" id="attDate">
  </label>
</header>

<main>
  <section class="summary" aria-label="Attendance summary">
    <div><b id="sTotal">0</b><span>Total students</span></div>
    <div><b id="sPresent">0</b><span>Present</span></div>
    <div><b id="sAbsent">0</b><span>Absent</span></div>
    <div><b id="sPct">0%</b><span>Overall attendance</span></div>
  </section>

  <section class="panel">
    <h2 id="formTitle">Add student</h2>
    <form id="studentForm" novalidate>
      <input type="hidden" id="editId">
      <label class="field">Name<input id="name" required></label>
      <label class="field">Student ID<input id="sid" required></label>
      <label class="field">Department<input id="dept" required></label>
      <div class="row">
        <button class="btn primary" type="submit" id="saveBtn">Add student</button>
        <button class="btn" type="button" id="cancelBtn" hidden>Cancel edit</button>
      </div>
      <p class="msg" id="formMsg" role="alert"></p>
    </form>
  </section>

  <section class="panel">
    <h2>Students</h2>
    <div class="filters">
      <label class="field">Search<input id="search" placeholder="Name, ID or department"></label>
      <label class="field">Status on selected date
        <select id="statusFilter">
          <option value="">All</option><option>Present</option><option>Absent</option>
          <option>Late</option><option>On Leave</option><option>Not marked</option>
        </select>
      </label>
      <label class="field">Low-attendance threshold (%)
        <input type="number" id="threshold" min="1" max="100" value="75">
      </label>
    </div>
    <div class="scroll">
      <table>
        <thead><tr><th>Name</th><th>ID</th><th>Department</th><th>Status</th><th>Attendance</th><th>Actions</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <p class="empty" id="empty" hidden>No students match. Add a student above or clear the filters.</p>
  </section>

  <section class="panel" id="historyPanel" hidden>
    <h2 id="historyTitle">Attendance history</h2>
    <div class="scroll">
      <table><thead><tr><th>Date</th><th>Status</th></tr></thead><tbody id="historyRows"></tbody></table>
    </div>
    <button class="btn" id="closeHistory">Close history</button>
  </section>
</main>
<script src="script.js"></script>
</body>
</html>
